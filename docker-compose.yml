services:
  web:
    # Frontend (frontend/web). Its Dockerfile expects the frontend/ tree
    # as build context: web/, config/, i18n/ are siblings inside it.
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    ports:
      - "${SIRIUS_PORT:-8000}:8000"
    environment:
      SIRIUS_HOST: 0.0.0.0
      SIRIUS_DATA_DIR: /srv/data
      SIRIUS_APP_TITLE: ${SIRIUS_APP_TITLE:-}
      SIRIUS_MAX_BODY_BYTES: ${SIRIUS_MAX_BODY_BYTES:-}
      SIRIUS_COMPANY_REPORT_URL: http://company-report:8000
    volumes:
      # The worker consumes data/queue and drops reports into data/reports
      # without a rebuild; both services see the same tree.
      - ./data:/srv/data
    restart: unless-stopped

  company-report:
    build:
      context: ./frontend
      dockerfile: company_report/Dockerfile
    restart: unless-stopped

  worker:
    # Producer bridge: polls data/queue, runs the analyzer, writes
    # data/reports. Coupling to web is the shared ./data volume only.
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_DATA_DIR: /srv/data
      WORKER_ENABLE_AI: ${WORKER_ENABLE_AI:-false}
      # LLM final documents (fstec/codedocs); needs AI_API_KEY as well.
      WORKER_ENABLE_AI_DOCUMENTS: ${WORKER_ENABLE_AI_DOCUMENTS:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      # Without these passthroughs the worker falls back to ai.model /
      # ai.base_url from config/settings.yaml baked into the image.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # The DAST sandbox target must be reachable from this container:
      # publish the port on all daemon-host interfaces (a loopback bind is
      # not reachable via host.docker.internal) and connect through it.
      SANDBOX_PUBLISH_BIND: ${SANDBOX_PUBLISH_BIND:-0.0.0.0}
      SANDBOX_CONNECT_HOST: ${SANDBOX_CONNECT_HOST:-host.docker.internal}
      # ZAP (a sibling container on the daemon) writes its JSON report into
      # this named volume; /zap/wrk here is the same volume, so the worker
      # can read it back. A plain -v path would resolve on the daemon host
      # filesystem, not inside this container.
      ZAP_WORK_DIR: ${ZAP_WORK_DIR:-/zap/wrk}
      ZAP_DOCKER_VOLUME: ${ZAP_DOCKER_VOLUME:-dast_zap_wrk}
    volumes:
      - ./data:/srv/data
      - dast_zap_wrk:/zap/wrk
      # Sibling daemon: sandbox targets and ZAP run as containers on the
      # same engine this worker talks to through the mounted socket.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Keeps host.docker.internal resolvable on Linux engines too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  # Fixed name: the worker passes it to the daemon verbatim (ZAP_DOCKER_VOLUME).
  dast_zap_wrk:
    name: dast_zap_wrk
