# Producer worker bridging the frontend queue contract to the analyzer.
# Consumes {data_dir}/queue/{scan_id}.json jobs and produces
# {data_dir}/{reports_dir}/{scan_id}/ artifacts the frontend serves.

data_dir: data
poll_interval_seconds: 2.0

# Passed to ScanOrchestrator.start_scan(enable_ai=...) per job.
# When false the analyzer's own settings.yaml ai.enabled governs (default off).
enable_ai: false

# Format engines this worker runs. Chosen FSTEC doc formats not enabled
# here are skipped. The audit report (report.html) is always produced.
formats:
  md: true
  html: true
  pdf: true
  docx: true
  zip: true

# LLM-generated final documents. Each spec maps a document id from
# frontend/config/reports.yaml to its system prompt (system_prompts/) and a
# per-call timeout. WORKER_ENABLE_AI_DOCUMENTS overrides `enabled`.
# Core report/doc are published first (UI unblocks); these run after and
# soft-fail into placeholders. Keep timeouts short on free LLM tiers.
ai_documents:
  enabled: true
  fstec:
    prompt: system_prompts/FSTEC.md
    timeout_seconds: 120
    max_findings: 50
    max_files: 20
    max_file_bytes: 40000
    max_prompt_chars: 80000
  codedocs:
    prompt: system_prompts/CODE_DOCUMENTATION.md
    timeout_seconds: 120
    max_findings: 40
    max_files: 25
    max_file_bytes: 40000
    max_prompt_chars: 80000

# Mirror of frontend/config/theme.yaml tokens. Kept local so the worker
# renders artifacts without reading another service's config tree; if you
# retheme the frontend, update the colors here too.
theme:
  colors:
    bg: "#0B0C10"
    surface: "#14161C"
    surface-raised: "#1C1F28"
    accent: "#8B5CF6"
    accent-strong: "#A78BFA"
    ink: "#F3EEE4"
    ink-soft: "#9B958A"
    ok: "#3DCF8E"
    warn: "#C4A1FF"
    fail: "#F07178"
    border: "#2C303C"
  # severity -> resolved hex (frontend maps severity -> token -> hex).
  severity_colors:
    critical: "#F07178"
    high: "#C4A1FF"
    medium: "#A78BFA"
    low: "#221A38"
    info: "#9B958A"

doc:
  disclaimer: >-
    Черновик для личного пользования / подготовки материалов. Не является
    полным сертифицированным комплектом документации по требованиям ФСТЭК России.
