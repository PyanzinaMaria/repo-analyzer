[project]
name = "audit-frontend"
version = "0.1.0"
description = "Web frontend for the code security audit service: intake of repositories and delivery of ready report files."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "python-multipart==0.0.34",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.14.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
