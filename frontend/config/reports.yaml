# Contract with producer tasks. The frontend never writes here; it reads
# data/reports/{scan_id}/ and serves what the manifest declares.

manifest_filename: manifest.json
summary_filename: summary.json

# Output formats the frontend knows how to serve. `viewer: framed` renders
# the file inside a sandboxed iframe page; `download: true` forces attachment.
formats:
  - { id: md,   media_type: text/markdown, viewer: none,   download: true }
  - { id: html, media_type: text/html,     viewer: framed, download: false }
  - { id: pdf,  media_type: application/pdf, viewer: none, download: true }
  - { id: docx, media_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document, viewer: none, download: true }
  - { id: json, media_type: application/json, viewer: none, download: true }
  - { id: zip, media_type: application/zip, viewer: none, download: true }

# Default FSTEC format when the form has no selection.
defaults:
  formats: [html]

# Serveable documents. The serveable artifact list (ReportConfig.artifacts)
# is derived as documents x formats with names following {document}.{format}.
# Legacy formats remain available for previously generated scans.
# DAST findings live inside the unified audit report — no separate dast_report.
documents:
  - id: report
    label_key: artifacts.docs.report
    formats: [html]
    legacy_formats: [md, pdf, docx]
  - id: doc
    label_key: artifacts.docs.doc
    formats: [html, md, pdf]
    legacy_formats: [docx]
  - id: fstec
    label_key: artifacts.docs.fstec
    formats: [html, md, pdf]
    legacy_formats: [docx]
  - id: codedocs
    label_key: artifacts.docs.codedocs
    formats: [zip]

# Pipeline stages producers report through manifest.json. Order is display
# order; a stage may be absent from the manifest until producers know it.
stages:
  - intake
  - analysis
  - report
