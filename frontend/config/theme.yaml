# Instrument noir — graphite console with violet signal.
# Tokens emit as CSS custom properties into static/css/theme.css.

colors:
  bg: "#0B0C10"
  surface: "#14161C"
  surface-raised: "#1C1F28"
  accent: "#8B5CF6"
  accent-strong: "#A78BFA"
  accent-soft: "#221A38"
  ink: "#F3EEE4"
  ink-soft: "#9B958A"
  ok: "#3DCF8E"
  warn: "#C4A1FF"
  fail: "#F07178"
  border: "#2C303C"

font:
  family: "'Sora', 'Segoe UI', system-ui, sans-serif"
  display: "'Syne', 'Sora', system-ui, sans-serif"
  size-base: 16px

shape:
  radius: 14px
  radius-small: 9px
  shadow: "0 18px 50px rgba(0, 0, 0, 0.45)"

severity_colors:
  critical: fail
  high: warn
  medium: accent
  low: accent-soft
  info: ink-soft
