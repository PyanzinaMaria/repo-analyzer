# Midnight violet theme. Every token is emitted as a CSS custom property into
# static/css/theme.css. Components reference var(--<token>) only.

colors:
  bg: "#12101E"            # page background — deep near-black violet
  surface: "#1A1730"       # cards, panels
  surface-raised: "#252042"
  accent: "#6C5CE7"        # primary buttons, highlights — deep purple
  accent-strong: "#8F7BFF" # hover, focus, links — brighter violet
  accent-soft: "#2E2952"   # soft fills (badges, hovers)
  ink: "#EDEBFA"           # main text — near-white lavender
  ink-soft: "#A49FD1"      # secondary text
  ok: "#5FBF77"            # success statuses
  warn: "#E0A34E"
  fail: "#E05B6C"
  border: "#37315C"

font:
  family: "'Segoe UI', 'Trebuchet MS', system-ui, sans-serif"
  size-base: 16px

shape:
  radius: 16px
  radius-small: 10px
  shadow: "0 6px 24px rgba(108, 92, 231, 0.25)"

# Donut chart colors: severity name -> color token above.
severity_colors:
  critical: fail
  high: warn
  medium: accent
  low: accent-soft
  info: ink-soft
