# Russian UI strings. Keys are dotted paths resolved by core.i18n.

app:
  subtitle: Проверка и аудит безопасности кода с помощью ИИ-агента

disclaimer:
  index: "Результаты аудита носят рекомендательный характер: возможны пропуски (false negatives) и ложные срабатывания. Не используйте их как единственное основание для решений по безопасности."
  scan: "Результаты носят рекомендательный характер и могут содержать пропуски (false negatives)."

nav:
  home: Главная

form:
  title: Отправка репозитория на аудит
  send: Отправить
  planned: запланировано
  fields:
    source_kind:
      label: Источник
      link: Ссылка на репозиторий
      files: Загрузка файлов
    repo_url:
      label: Ссылка на публичный репозиторий GitHub или GitLab
      placeholder: "https://github.com/owner/repo"
    files:
      label: Файлы или архив репозитория
      help: Поддерживаются zip-архив, отдельные файлы и папки. Ограничения и допустимые типы файлов описаны в правилах загрузки.
    methods:
      label: Методы анализа
      help: "По умолчанию выполняется SAST; по желанию отметьте дополнительные методы."
    formats:
      label: Форматы отчёта
      help: Выбранные форматы применяются к отчёту аудита и к документации ФСТЭК.

methods:
  sast:
    label: SAST — статический анализ
    description: Детерминированный анализ исходного кода (Bandit, pip-audit, AST-инвентаризация).
  llm_agentic:
    label: LLM-агент
    description: ИИ-проверка кода после статического анализа.
  dast:
    label: DAST — динамический анализ
    description: Автоподъём приложения в Docker и динамический анализ (preflight + ZAP).
  pentest:
    label: Пентест
    description: Ручная проверка с помощью ИИ-агента. Запланировано.

formats:
  md:
    label: Markdown (.md)
  html:
    label: HTML
  pdf:
    label: PDF
  docx:
    label: Word (.docx)
  json:
    label: JSON

rules:
  title: Правила загрузки
  max_size: "Максимальный размер загрузки: {max_upload}"
  max_unpacked: "Максимальный размер после распаковки: {max_unpacked}"
  max_file: "Максимальный размер одного файла: {max_file}"
  max_files: Не более {count} файлов
  allowed: Принимаются только исходные коды и файлы манифестов; бинарные файлы, каталоги .git и node_modules отклоняются.

scan:
  title: Заявка на аудит
  status_title: Статус
  created_at: Создано
  not_found: Заявка не найдена
  elapsed: "Прошло: {seconds} с"
  stages:
    intake: Приём данных
    analysis: Анализ
    report: Формирование отчёта
  stage_pending: Ожидание
  stage_running: Выполняется
  stage_ok: Готово
  stage_fail: Ошибка

results:
  title: Результаты
  pending: Отчёт готовится. Обновите страницу позже.
  no_summary: Сводные данные пока недоступны.
  scan_kind: Тип проверки
  kinds:
    sast: SAST
    dast: DAST
    sast_dast: SAST + DAST

docs:
  title: Документация
  description: После завершения аудита здесь будут доступны единый отчёт (секции по выбранным методам) и документация ФСТЭК в выбранных форматах.

artifacts:
  docs:
    report: Отчёт аудита
    doc: Документация ФСТЭК
  view: Смотреть
  download: Скачать
  back: К заявке

errors:
  generic: Не удалось обработать запрос
  required: Обязательное поле
  too_long: Слишком длинное значение (не более {limit} символов)
  bad_choice: Выбрано недопустимое значение
  unavailable_choice: Выбранный вариант недоступен в этой сборке
  too_many_files: Выбрано слишком много файлов (не более {limit})
  body_too_large: Загрузка превышает допустимый размер
  bad_source: Укажите ссылку на репозиторий или загрузите файлы
  bad_url: Ссылка недопустима. Поддерживаются только публичные репозитории GitHub и GitLab
  empty_upload: Не выбрано ни одного файла
  not_found: Не найдено
  zip_codes:
    bad_archive: Архив повреждён или не является zip-файлом
    too_large: Архив слишком велик после распаковки
    file_too_large: Один из файлов превышает допустимый размер
    too_many_files: В загрузке слишком много файлов
    too_deep: Слишком глубокая вложенность каталогов
    ratio: "Подозрение на zip-бомбу: недопустимая степень сжатия"
    traversal: Обнаружен недопустимый путь в загрузке
    symlink: Символические ссылки в архивах не допускаются
    forbidden: Загрузка содержит запрещённые каталоги
    hidden: Скрытые файлы не допускаются
    extension: Тип файлов не поддерживается
    timeout: Превышено время обработки загрузки

timing:
  analysis: "Анализ: {analysis} с"
  report: "Отчёт: {report} с"
  total: "Всего: {total} с"

donut:
  title: Сводка по уязвимостям
  severity:
    critical: Критический
    high: Высокий
    medium: Средний
    low: Низкий
    info: Информация
