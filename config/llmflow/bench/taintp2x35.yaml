# TaintP2X ground truth (He et al., "TaintP2X: Detecting Taint-Style Prompt-to-Anything Injection
# Vulnerabilities in LLM-Integrated Applications", ICSE 2026, Table 2): 35 real P2Xi vulnerabilities
# collected by the authors from LLMSmith, AgentFuzz, NVD, GitHub Advisory Database and huntr.
#
# Per entry:
#   repo / ref     vulnerable version (tag or commit) — the table's version when a tag exists, otherwise the
#                  closest tag inside the advisory's vulnerable range (noted in `note`)
#   path           sub-directory to scan (monorepos); default: repository root
#   expect.file    regex on a hop's file — where the vulnerable code lives (from the advisory / fix commit)
#   expect.func    regex on that hop's function (qualified name)
#   expect.sink    optional regex on the sink hop's function, when the vulnerable call is known
#   class          code_injection | sql_injection | file_rw | ssrf (mapped to llmflow sink classes in eval)
#   scope          app (the project calls an LLM SDK itself) | framework (the bug is inside an LLM framework,
#                  LLM output comes from the framework's own model abstraction)
#   reported       published results in TaintP2X Table 2: Y / N / '-' (tool cannot analyze it)
#
# A finding counts as a hit when one of its hops matches expect.file AND expect.func, its sink matches
# expect.sink (if given) and its sink class is one of the classes allowed for `class`.
source: https://doi.org/10.1145/3744916.3773199
