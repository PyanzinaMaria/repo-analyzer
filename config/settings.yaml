# Language plugins: only listed ids with a registered handler will run.
# Add/remove ids here to enable/disable languages without code changes.
enabled_languages:
  - python

# Analysis runners this deployment offers (see app/analysis/registry.py).
# The frontend picks methods in the form; the worker maps them to these
# runner keys via frontend/config/analysis.yaml. `dynamic` boots the
# sandbox and runs DAST (ZAP/preflight). `manual` is not implemented yet.
methods:
  - static
  - ai
  - dynamic

# SAST tool lists per language family (see config/sast.yaml for timeouts/args).
# Missing binaries are soft-skipped and recorded in language meta.
sast:
  tools:
    python: [bandit, semgrep]
    javascript: [eslint, semgrep]

# Example for later:
# enabled_languages:
#   - python
#   - javascript

scan:
  exclude_dirs:
    - .git
    - .venv
    - venv
    - node_modules
    - __pycache__
    - .pytest_cache
    - dist
    - build
    - .mypy_cache
    - .ruff_cache

reports:
  disclaimer: >
    Черновик для личного пользования / подготовки материалов.
    Не является полным сертифицированным комплектом документации
    по требованиям ФСТЭК России (приказ №76 и смежные документы).

# Optional LLM stage. Requires AI_API_KEY in .env.
# Soft-fail: errors do not fail the deterministic scan.
# modes: review (file review), triage (SAST verdicts), discovery (entry/sink hunt).
# Only runs when the job selects the `ai` runner (UI: LLM-агент).
ai:
  enabled: true
  provider: openai_compatible
  base_url: https://openrouter.ai/api/v1
  model: nvidia/nemotron-3.5-super-vl:free
  timeout_seconds: 120
  max_files: 25
  max_file_bytes: 40000
  max_findings: 50
  modes: [review, triage, discovery]
  max_concurrency: 1
  budget_usd: 0
  triage:
    max_findings: 10
    per_prompt: 5
    budget_tokens: 6000
  discovery:
    n_base: 6
    n_cap: 12
    per_prompt: 5
    budget_tokens: 10000

# Dynamic Application Security Testing (HTTP web only).
# Language-specific DAST hooks follow enabled_languages via LanguageHandler.
dast:
  enabled: true
  engine: zap_baseline
  zap_image: "ghcr.io/zaproxy/zaproxy:stable"
  timeout_seconds: 300
  allowed_schemes:
    - http
    - https
  # Allow RFC1918 / localhost targets (needed for sandbox/dev). Keep false in prod.
  allow_private_targets: true

  # Passive ZAP baseline needs the ZAP docker image (~1 GB). Disable locally
  # when it is not pulled; the active pentest agent does not depend on it.
  zap_enabled: true

  # Active pentest agent on top of the passive ZAP baseline.
  pentest:
    enabled: true
    llm_enabled: true
    max_steps: 12
    max_seconds: 120

# Auto-boot web targets in Docker after SAST so DAST can run on the same intake.
sandbox:
  enabled: true
  boot_timeout_seconds: 90
  memory: 512m
  cpus: "1.0"
  network: repo-analyzer-dast
  # 3.9 works better with intentionally old vulnerable demo deps
  base_image: "python:3.9-slim"
  # IP the target port is published on (docker -p bind) and host it is
  # reachable on from the worker process (readiness/preflight URLs).
  # SANDBOX_PUBLISH_BIND / SANDBOX_CONNECT_HOST override for a worker that
  # itself runs in a container (0.0.0.0 / host.docker.internal).
  publish_host: "127.0.0.1"
  connect_host: "127.0.0.1"
