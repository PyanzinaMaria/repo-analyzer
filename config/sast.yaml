# SAST tools and product-code scope. Flags verified against installed versions (see README).
merge_line_tol: 3

# Optional explicit binary paths; otherwise PATH and scripts/setup.sh locations are used.
tool_paths: {}

exclude_dirs: [node_modules, .git, .venv, venv, dist, build, coverage, vendor, __pycache__]

tools:
  semgrep:
    version_args: [--version]
    enabled: true
    timeout_s: 1200
    # --no-git-ignore: scans must be deterministic and independent of the target's git state
    # (benchmark snapshots are plain checkouts, often outside any git repository).
    args:
      python: [--no-git-ignore, --config, p/python, --config, p/owasp-top-ten]
      javascript: [--no-git-ignore, --config, p/javascript, --config, p/typescript, --config, p/owasp-top-ten]
      typescript: [--no-git-ignore, --config, p/javascript, --config, p/typescript, --config, p/owasp-top-ten]
  opengrep:
    enabled: true
    languages: [python, javascript, typescript, java, csharp]
    timeout_s: 1200
    version_args: [--version]
    command: [scan, --config, '{config}/rules/paired.yaml', --no-git-ignore, --sarif, --output, '{report}', --jobs, '2', .]
  devskim:
    enabled: true
    languages: [python, javascript, typescript, java, csharp]
    timeout_s: 1200
    version_args: [--version]
    command: [analyze, --source-code, '{root}', --output-file, '{report}']
  njsscan:
    # Disabled: its semgrep engine (libsast) returns no results on Windows; enable on Linux hosts.
    enabled: false
    languages: [javascript]
    requires: [package.json]
    timeout_s: 1200
    version_args: [--version]
    ok_codes: [0, 1]
    command: [., --sarif, --output, '{report}']
  graudit:
    enabled: true
    languages: [python, javascript, typescript, java, csharp]
    timeout_s: 1200
    version_args: [-v]
    output: graudit
    ok_codes: [0, 1]
    # -x keeps common binary files out of the grep sweep (graudit has no -I flag)
    command: [-B, -z, -c, '0', -x, 'exe,dll,pdb,jar,zip,png,jpg,jpeg,gif,ico,bin,so,class,woff,woff2', -d, '{args}', .]
    args: {python: [python], javascript: [js], typescript: [typescript], java: [java], csharp: [dotnet]}
  joern:
    enabled: true
    languages: [java]
    timeout_s: 1800
    version_args: [--version]
    # --nooverlays: the query only needs parser-level properties; overlay passes crash on large CPGs.
    prepare: [joern-parse, '{root}', --language, JAVASRC, --nooverlays, --output, '{work}/cpg.bin']
    # Paths go via env: the Windows launcher splits --param on "=".
    env: {JOERN_CPG: '{work}/cpg.bin', JOERN_REPORT: '{report}'}
    command: [--script, '{config}/rules/weak-digest.sc']
  spotbugs:
    enabled: true
    languages: [java]
    timeout_s: 1200
    version_args: [-version]
    inputs: ['**/*.java']
    # Core SpotBugs has no crypto/security detectors; FindSecBugs (required, resolved
    # via tool_paths as {findsecbugs-plugin}) provides them, findings map to source lines.
    prepare: [javac, -proc:none, -g, -d, '{work}', '{argfile:inputs}']
    command: [-textui, -pluginList, '{findsecbugs-plugin}', -sarif, -output, '{report}', -sourcepath, '{root}', '{work}']
  security-code-scan:
    enabled: true
    executable: security-scan
    languages: [csharp]
    timeout_s: 1200
    # Ordered preference: solution first, then the canonical src/ project, then any project file.
    inputs: ['**/*.sln', 'src/**/*.csproj', '**/*.csproj']
    prepare: [dotnet, restore, '{project}']
    command: ['{project}', '--export={report}']
  bandit:
    version_args: [--version]
    enabled: true
    timeout_s: 1200
  eslint:
    # Opt-in: needs Node + eslint-plugin-security layout from tools/eslint.
    enabled: false
    timeout_s: 1200
  codeql:
    # Opt-in: heavy CLI, often missing on Windows dev hosts.
    enabled: false
    timeout_s: 1800
    args:
      python: [codeql/python-queries:codeql-suites/python-security-extended.qls]
      javascript: [codeql/javascript-queries:codeql-suites/javascript-security-extended.qls]
      typescript: [codeql/javascript-queries:codeql-suites/javascript-security-extended.qls]

# Product-code scope: findings and code-index entries outside it (tests, examples, docs, vendored and
# minified code) are dropped. The benchmark uses the same rules for its ground truth.
path_excludes:
  - '(^|/)(tests?|__tests__|spec|specs|testing|e2e|fixtures?|mocks?|examples?|docs?|benchmarks?)/'
  - '(^|/)(test_[^/]*|[^/]*_test)\.py$'
  - '\.(test|spec)\.[cm]?[jt]sx?$'
  - '(^|/)(conftest|setup|noxfile|tasks)\.py$'
  - '(^|/)(node_modules|vendor|vendored|third_party|dist|build|out|coverage|site-packages|\.venv|venv)/'
  - '\.min\.js$'
  - '\.bundle\.js$'
  - '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Pipfile\.lock)$'
  - '(?i)(^|/)(changelog|changes|history|news|authors|contributors)[^/]*$'
  - '\.d\.ts$'

source_extensions:
  java: [.java]
  csharp: [.cs]
  python: [.py]
  javascript: [.js, .cjs, .mjs, .jsx]
  typescript: [.ts, .tsx, .mts, .cts]
