# DAST benchmark: live web targets + per-tool scan runs (`python -m bench dast up|scan|eval|down|compare`).
# Ground truth comes from the SAST corpora already built under data/bench (OWASP Benchmark
# expectedresults CSVs, RealVuln hand labels); this config only describes the live side.

scan_timeout_s: 1800          # per tool per target (30 min)
boot_timeout_s: 900           # per-app readiness budget (sandbox compose/build cap = max(this, 300))
watchdog_timeout_s: 1500      # hard cap for one boot child process
network: repo-analyzer-dast   # shared docker network for dockerized tools and targets

owasp_java:
  scheme: https
  port: 8443
  container: dast-bench-owasp-java-app
  image: dast-bench:owasp-java

owasp_python:
  scheme: http
  port: 5000
  container: dast-bench-owasp-python-app
  image: dast-bench:owasp-python

tools:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    time_limit_m: 30          # zap-full-scan -T (spider+active scan budget, minutes)
  wapiti:
    executable: wapiti        # pip install wapiti3 (into the bench venv)
    modules: common           # attack modules; excludes nikto/wapp fingerprint extras
    level: 2                  # --level 2: aggressive parameter fuzzing
  nuclei:
    executable: nuclei        # pinned binary on PATH (see docs/DAST-BENCHMARK.md)
    templates_dir: null       # null = user default; run `nuclei -update-templates` once
    severity: low,medium,high,critical   # info/tech-detection templates pollute FP counts
  offat:
    executable: offat         # pip install offat (OWASP API Fuzzing Tool)
  nikto:
    image: ghcr.io/sullo/nikto:latest # Perl tool: official image (ghcr; Docker Hub sullo/nikto is gone)

# Per-app boot recipes for the pinned realvuln corpus. image = prebuilt community image
# (bypasses dead-dep builds of ancient pinned commits); port = the container port that
# actually serves HTTP (fixes DB-port misdetection); java_war = maven build -> tomcat:9.
realvuln_overrides:
  rv-juice-shop:       {image: bkimminich/juice-shop:latest, port: 3000}
  rv-juice-shop-goof:  {image: bkimminich/juice-shop:latest, port: 3000}
  rv-realvuln-bodgeit: {image: psiinon/bodgeit:latest, port: 8080}
  rv-dvna:             {image: appsecco/dvna:latest, port: 3000}
  rv-dsvw:             {image: appsecco/dsvw:latest, port: 8000}  # appsecco image serves dsvw.py on 8000
  rv-dvpwa:            {port: 8080}        # compose maps 8080:8080; detection picked the DB port
  rv-dvga:             {port: 5000}        # flask GraphQL, slow first start
  rv-realvuln-altoroj: {java_war: true, port: 8080}
